  :root {
    color-scheme: dark;
    --noche: #02090F;
    --crema: #EBDDBF;
    --celeste: #5B8DC9;
    --celeste-claro: #8FB6E3;
    --oro: #D2A95A;
    --oro-viejo: #A8854A;
    --rojo: #B8322A;
    --suave: #9AA6B6;
    --linea: #2A3A4F;
    --display: "PDSC", "Playfair Display SC", Georgia, serif;
    --texto: "PTS", "PT Sans", "Segoe UI", system-ui, sans-serif;
    --marco: 140px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--noche); }
  body {
    color: var(--crema);
    font-family: var(--texto);
    font-size: 1.0625rem;
    line-height: 1.5;
    padding: 1rem .5rem 2rem;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Marco fileteado */
  .card {
    position: relative;
    width: 100%;
    max-width: 38rem;
    padding: 6rem 3.5rem 7rem;
  }
  .card::before {
    content: "";
    position: absolute;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: .6rem;
    margin: .35rem 0 .25rem;
  }
  .titulo .y { color: var(--crema); font-weight: 900; font-size: clamp(2rem, 8vw, 2.8rem); }
  .sprig { height: .7rem; width: auto; justify-self: end; }
  .sprig.der { transform: scaleX(-1); justify-self: start; }
  .t2 {
    color: var(--celeste);
    font-weight: 900;
    font-size: clamp(2.2rem, 10.4vw, 3.7rem);
    text-shadow: 0 2px 0 #000;
  }
  .titulo .mas {
    display: flex; align-items: center; justify-content: center; gap: .75rem;
    color: var(--crema); font-family: var(--texto); font-weight: 700; font-size: 1.6rem;
    margin: .6rem 0 .3rem;
  }
  .mas::before, .mas::after { content: ""; width: 3.5rem; height: 1px; background: var(--oro-viejo); }
  .t3 {
    color: var(--oro-viejo);
    font-weight: 900;
    font-size: clamp(1.9rem, 8.6vw, 3rem);
    text-shadow: 0 2px 0 #000;
  }
  .laureles { position: relative; }
  .laurel {
    position: absolute;
    top: 50%;
    height: clamp(3.4rem, 15vw, 6rem);
    width: auto;
    transform: translateY(-58%);
    opacity: .95;
  }
  .laurel.izq { left: -1.6rem; }
  .laurel.der { right: -1.6rem; transform: translateY(-58%) scaleX(-1); }

  .divider { display: block; width: 100%; max-width: 28rem; height: auto; margin: 1.6rem auto 1.4rem; }

  .datos { text-align: center; margin: 0; padding: 0; list-style: none; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .datos li { font-size: clamp(1.15rem, 4.6vw, 1.5rem); }
  .datos .fecha, .datos .lugar { color: var(--oro); }
  .datos .hora { color: var(--crema); font-size: clamp(1rem, 3.9vw, 1.25rem); }
  .regla {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    margin: .5rem auto; max-width: 16rem;
  }
  .regla::before, .regla::after { content: ""; flex: 1; height: 1px; background: var(--oro-viejo); }
  .regla i { width: .4rem; height: .4rem; border-radius: 50%; background: var(--rojo); }

  /* Formulario */
  .rsvp-head { margin: 2.4rem 0 1.4rem; text-align: center; }
  .rsvp-head h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 2rem; color: var(--crema); line-height: 1.1; }
  .rsvp-head p { margin: .3rem 0 0; color: var(--suave); }

  form { display: grid; gap: 1.35rem; }
  label, legend { display: block; font-weight: 700; margin-bottom: .45rem; }
  .opt { font-weight: 400; color: var(--suave); }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    color: var(--crema);
    background: rgba(143, 182, 227, .05);
    border: 1px solid var(--linea);
    border-radius: .3rem;
    padding: .75rem .9rem;
  }
  input::placeholder, textarea::placeholder { color: #6B7788; }
  textarea { min-height: 4.5rem; resize: vertical; }
  input:hover, textarea:hover { border-color: #3B5069; }
  :focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible { border-color: var(--oro); outline: 0; box-shadow: 0 0 0 1px var(--oro); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span {
    display: block;
    text-align: center;
    padding: .8rem .5rem .9rem;
    border: 1px solid var(--oro-viejo);
    border-radius: .3rem;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--crema);
    cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .choice span:hover { border-color: var(--oro); }
  .choice input:checked + span.si { background: var(--celeste); border-color: var(--celeste-claro); color: #fff; box-shadow: inset 0 0 0 3px var(--noche), inset 0 0 0 4px var(--celeste-claro); }
  .choice input:checked + span.no { background: #1C2633; border-color: var(--suave); box-shadow: inset 0 0 0 3px var(--noche), inset 0 0 0 4px var(--suave); }
  .choice input:focus-visible + span { outline: 2px solid var(--oro); outline-offset: 3px; }

  [hidden] { display: none !important; }

  .send {
    margin-top: .3rem;
    font-family: var(--display); font-weight: 900; font-size: 1.35rem;
    padding: .85rem 1rem 1rem;
    background: linear-gradient(#DDB669, #B98F45);
    color: var(--noche);
    border: 0; border-radius: .3rem;
    box-shadow: inset 0 0 0 3px #B98F45, inset 0 0 0 4px #F2D79C;
    cursor: pointer;
  }
  .send:hover { background: linear-gradient(#E6C27A, #C29A4F); }
  .send:disabled { opacity: .6; cursor: progress; }
  .status { margin: 0; min-height: 1.5em; font-weight: 700; text-align: center; }
  .status.error { color: #FF9A8F; }

  /* Confirmado */
  .done { text-align: center; padding: .5rem 0 1rem; }
  .done:focus { outline: 0; }
  .stamp {
    display: inline-block;
    font-family: var(--display); font-weight: 900; font-size: 2.1rem;
    color: var(--celeste-claro);
    border: 3px double var(--celeste-claro);
    padding: .25rem 1.1rem .35rem;
    transform: rotate(-5deg);
    margin: .5rem 0 1rem;
  }
  .stamp.no { color: var(--suave); border-color: var(--suave); }
  .done p { margin: .2rem 0; font-size: 1.15rem; }
  .again {
    margin-top: 1.4rem;
    font: inherit; font-weight: 700;
    padding: .7rem 1.2rem;
    background: none; color: var(--oro);
    border: 1px solid var(--oro-viejo); border-radius: .3rem; cursor: pointer;
  }

  @media (max-width: 30rem) {
    :root { --marco: 84px; }
    .card { padding: 3.6rem 1.9rem 4.6rem; }
    .laurel.izq { left: -1.85rem; }
    .laurel.der { right: -1.85rem; }
    .mas::before, .mas::after { width: 2.5rem; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .stamp { animation: sello .35s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes sello { from { transform: rotate(-5deg) scale(1.8); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
  }
</style>
</head>

<script>
  /* ====== PEGÁ ACÁ LA URL DE TU APPS SCRIPT (termina en /exec) ====== */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeGAO6Z6t6nuXa7I0XkSej3K4Dp_EajGhqI7YXrtJC5AYVX2GXGjmLx-tqQiqgGXCLQA/exec";
  /* =================================================================== */

  const $ = (id) => document.getElementById(id);
  const form = $("rsvp");

  const invitado = new URLSearchParams(location.search).get("invitado");
  if (invitado) $("nombre").value = invitado;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = $("status");
    status.className = "status";
    const nombre = $("nombre").value.trim();
    const asiste = form.querySelector('input[name="asiste"]:checked');
    if (!nombre) { status.className = "status error"; status.textContent = "Escribí tu nombre para confirmar."; $("nombre").focus(); return; }
    if (!asiste) { status.className = "status error"; status.textContent = "Elegí si venís o no."; return; }

    const datos = { nombre, asiste: asiste.value, mensaje: $("mensaje").value.trim() };

    status.textContent = "Enviando…";
    $("send").disabled = true;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(datos)
      });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "error");
      mostrarConfirmacion(datos);
    } catch (err) {
      status.className = "status error";
      status.textContent = "No se pudo enviar. Revisá tu conexión y probá de nuevo.";
    } finally {
      $("send").disabled = false;
    }
  });

  function mostrarConfirmacion(d) {
    const va = d.asiste === "Sí";
    const nom = d.nombre.split(/\s+/)[0];
    $("stamp").textContent = va ? "¡Confirmado!" : "Recibido";
    $("stamp").className = "stamp" + (va ? "" : " no");
    $("done-msg").textContent = va ? "¡Te esperamos, " + nom + "!" : "Gracias por avisar, " + nom + ".";
    form.hidden = true;
    $("done").hidden = false;
    $("done").focus();
  }

  $("editar").onclick = () => {
    $("status").className = "status";
    $("status").textContent = "Si corregís, se toma como válida tu última respuesta.";
    $("done").hidden = true;
    form.hidden = false;
  };
</script>
</body>
</html>
